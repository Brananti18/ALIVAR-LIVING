<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Penyewa - ALIVAR LIVING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-page">
        <img
            src="03-login-penyewa.png"
            alt="Login Penyewa ALIVAR LIVING"
            class="login-image"
        >

        <form id="loginForm" class="login-form">
            <input
                type="email"
                id="email"
                aria-label="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                aria-label="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" aria-label="Masuk"></button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
